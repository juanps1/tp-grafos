spring.application.name=tp-grafos

# Neo4j Configuration (Aura o Local)
# Para Aura: neo4j+s://xxxxx.databases.neo4j.io
# Para Local: bolt://localhost:7687
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework.data.neo4j=DEBUG
logging.level.com.uade.progra3.tpgrafos=DEBUG
